<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redlime Solutions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #222; }

    nav {
      background: #1a1a2e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 40px;
    }
    nav img { height: 36px; }
    nav ul { list-style: none; display: flex; gap: 24px; }
    nav ul a { color: #ccc; text-decoration: none; font-size: 14px; }
    nav ul a:hover { color: #fff; }

    .hero {
      background: #1a1a2e;
      color: white;
      text-align: center;
      padding: 80px 20px;
    }
    .hero h1 { font-size: 2rem; margin-bottom: 12px; }
    .hero p { color: #aaa; margin-bottom: 24px; }
    .hero a {
      background: #e63946;
      color: white;
      padding: 10px 28px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 15px;
    }

    .contact {
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 32px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .contact h2 { margin-bottom: 20px; font-size: 1.3rem; }
    .contact label { display: block; margin-bottom: 4px; font-size: 14px; color: #555; }
    .contact input,
    .contact textarea {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .contact button {
      background: #e63946;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }

    @media (max-width: 600px) {
      nav { flex-direction: column; gap: 12px; }
      .hero h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="#"><img src="https://www.redlimesolutions.com/img/logo-dark.png" alt="Redlime Solutions"></a>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>Network & IT Operations</h1>
    <p>Reliable infrastructure. Built to last.</p>
    <a href="#contact">Get in Touch</a>
  </section>

  <section class="contact" id="contact">
    <h2>Contact Us</h2>
    <form id="contactForm">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="your@email.com" required>

      <label for="msg">Message</label>
      <textarea id="msg" rows="4" placeholder="What can we help with?" required></textarea>

      <button type="submit">Send</button>
    </form>
  </section>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Message sent!');
      this.reset();
    });
  </script>

</body>
</html>
